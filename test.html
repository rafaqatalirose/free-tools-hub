<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Counter Online</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .tool-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid #f3f4f6;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4 antialiased">

    <div class="w-full max-w-4xl tool-card p-6 md:p-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-800 mb-2">📊 Word Counter Online</h1>
            <p class="text-sm md:text-base text-gray-500">Analyze your text metrics, track specific length limits, and calculate reading metrics instantly.</p>
        </div>

        <!-- Counter Grid Stats Layout -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
            <div class="bg-indigo-50/50 border border-indigo-100 rounded-xl p-4 text-center">
                <span class="block text-2xl md:text-3xl font-bold text-indigo-700" id="wordCount">0</span>
                <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Words</span>
            </div>
            <div class="bg-emerald-50/50 border border-emerald-100 rounded-xl p-4 text-center">
                <span class="block text-2xl md:text-3xl font-bold text-emerald-700" id="charCount">0</span>
                <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Characters</span>
            </div>
            <div class="bg-amber-50/50 border border-amber-100 rounded-xl p-4 text-center">
                <span class="block text-2xl md:text-3xl font-bold text-amber-700" id="readingTime">0s</span>
                <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Reading Time</span>
            </div>
            <div class="bg-rose-50/50 border border-rose-100 rounded-xl p-4 text-center">
                <span class="block text-2xl md:text-3xl font-bold text-rose-700" id="speakingTime">0s</span>
                <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Speaking Time</span>
            </div>
        </div>

        <!-- Input Terminal Area -->
        <div class="flex flex-col gap-2">
            <label class="text-sm font-semibold text-gray-700">Type or Paste Your Content:</label>
            <textarea id="inputText" class="w-full h-64 p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-none transition text-gray-700 text-base" placeholder="Start typing your article, essay, or copy assignment here to compute immediate structural statistics..."></textarea>
        </div>

        <!-- System Action Buttons Layout -->
        <div class="flex flex-wrap items-center justify-between gap-4 mt-6 border-t border-gray-100 pt-4">
            <div class="text-xs text-gray-400 font-medium" id="sentenceSummary">
                0 Sentences | 0 Paragraphs
            </div>
            <div class="flex items-center gap-3">
                <button id="copyBtn" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl shadow-md shadow-indigo-100 transition transform active:scale-95 cursor-pointer text-sm">
                    📋 Copy Text
                </button>
                <button id="clearBtn" class="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-600 font-medium rounded-xl transition transform active:scale-95 cursor-pointer text-sm">
                    🗑️ Clear All
                </button>
            </div>
        </div>

        <!-- Notification Toast Layout -->
        <div id="toast" class="fixed bottom-5 right-5 bg-gray-900 text-white text-sm px-4 py-2 rounded-lg opacity-0 transition-opacity duration-300 pointer-events-none shadow-lg">
            Text copied to clipboard!
        </div>
    </div>

    <!-- Processing Controller Logic -->
    <script>
        const inputText = document.getElementById('inputText');
        const wordCount = document.getElementById('wordCount');
        const charCount = document.getElementById('charCount');
        const readingTime = document.getElementById('readingTime');
        const speakingTime = document.getElementById('speakingTime');
        const sentenceSummary = document.getElementById('sentenceSummary');
        
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');
        const toast = document.getElementById('toast');

        function processTextStats() {
            const text = inputText.value;
            
            // 1. Character Matrix Computation
            const totalChars = text.length;
            charCount.textContent = totalChars;

            // 2. Token Word Counting Logic via Regex Boundaries
            const cleanText = text.trim();
            const totalWords = cleanText === '' ? 0 : cleanText.split(/\s+/).length;
            wordCount.textContent = totalWords;

            // 3. Sentences & Paragraph Matrix Tracking
            const totalSentences = cleanText === '' ? 0 : text.split(/[.!?]+/).filter(s => s.trim().length > 0).length;
            const totalParagraphs = cleanText === '' ? 0 : text.split(/\n+/).filter(p => p.trim().length > 0).length;
            sentenceSummary.textContent = `${totalSentences} Sentences | ${totalParagraphs} Paragraphs`;

            // 4. Reading and Speaking Time Processing Formulas
            // Average reading speed: 225 words per minute
            // Average speaking speed: 130 words per minute
            if (totalWords > 0) {
                const readMinutes = totalWords / 225;
                const speakMinutes = totalWords / 130;

                readingTime.textContent = formatTimeMetrics(readMinutes);
                speakingTime.textContent = formatTimeMetrics(speakMinutes);
            } else {
                readingTime.textContent = '0s';
                speakingTime.textContent = '0s';
            }
        }

        function formatTimeMetrics(minutes) {
            const totalSeconds = Math.round(minutes * 60);
            if (totalSeconds < 60) {
                return `${totalSeconds}s`;
            }
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            return secs > 0 ? `${mins}m ${secs}s` : `${mins}m`;
        }

        // Live Event Pipeline
        inputText.addEventListener('input', processTextStats);

        clearBtn.addEventListener('click', () => {
            inputText.value = '';
            processTextStats();
        });

        copyBtn.addEventListener('click', () => {
            if (!inputText.value.trim()) return;
            navigator.clipboard.writeText(inputText.value).then(() => {
                toast.classList.remove('opacity-0');
                setTimeout(() => {
                    toast.classList.add('opacity-0');
                }, 2000);
            });
        });
    </script>
</body>
</html>
