<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium QR Code Generator Tool</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-transparent text-slate-800 min-h-screen p-2 md:p-4">

    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-lg border border-slate-100 overflow-hidden">
        <div class="p-5 md:p-8 bg-gradient-to-r from-blue-600 to-indigo-700 text-white text-center">
            <h1 class="text-xl md:text-3xl font-bold tracking-tight">Custom QR Code Generator</h1>
            <p class="text-blue-100 mt-1 text-xs md:text-sm">Generate, customize, and download high-resolution QR codes instantly.</p>
        </div>

        <div class="p-5 md:p-8 grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5">Enter Text or URL Link</label>
                    <input type="text" id="qr-text" value="https://everyday.odoo.com/" class="w-full px-3 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm" placeholder="e.g., https://example.com">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Foreground Color</label>
                        <div class="flex items-center gap-2 border border-slate-200 p-2 rounded-xl">
                            <input type="color" id="fg-color" value="#000000" class="w-8 h-8 border-0 rounded-lg cursor-pointer">
                            <span class="text-xs text-slate-500 font-mono">Dark Pattern</span>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Background Color</label>
                        <div class="flex items-center gap-2 border border-slate-200 p-2 rounded-xl">
                            <input type="color" id="bg-color" value="#ffffff" class="w-8 h-8 border-0 rounded-lg cursor-pointer">
                            <span class="text-xs text-slate-500 font-mono">Light Panel</span>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5">QR Code Resolution (Size)</label>
                    <select id="qr-size" class="w-full px-3 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white transition text-sm">
                        <option value="128">128 x 128 px (Small Display)</option>
                        <option value="256" selected>256 x 256 px (Standard Web)</option>
                        <option value="512">512 x 512 px (High Quality Print)</option>
                    </select>
                </div>

                <button onclick="generateQRCode()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold rounded-xl shadow-md shadow-blue-200 transition transform active:scale-98 cursor-pointer">
                    Generate Matrix Code
                </button>
            </div>

            <div class="flex flex-col items-center justify-center bg-slate-50 p-6 rounded-2xl border border-dashed border-slate-200 min-h-[280px]">
                <div class="text-center mb-3">
                    <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 bg-slate-200/60 px-2.5 py-1 rounded-full">Dynamic Preview</span>
                </div>
                
                <div id="qrcode-container" class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 transition-all duration-300"></div>

                <button id="download-btn" onclick="downloadQR()" class="mt-4 flex items-center gap-2 px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-xl shadow-sm transition disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" />
                    </svg>
                    Download PNG Image
                </button>
            </div>
        </div>
    </div>

    <script>
        let qrInstance = null;

        function generateQRCode() {
            const textInput = document.getElementById('qr-text').value.trim();
            const sizeInput = parseInt(document.getElementById('qr-size').value);
            const fgColor = document.getElementById('fg-color').value;
            const bgColor = document.getElementById('bg-color').value;
            const container = document.getElementById('qrcode-container');
            const downloadBtn = document.getElementById('download-btn');

            if (!textInput) {
                alert('Please input text or a valid URL link string.');
                return;
            }

            container.innerHTML = "";

            qrInstance = new QRCode(container, {
                text: textInput,
                width: sizeInput,
                height: sizeInput,
                colorDark: fgColor,
                colorLight: bgColor,
                correctLevel: QRCode.CorrectLevel.H
            });

            setTimeout(() => {
                const imgElement = container.querySelector('img');
                const canvasElement = container.querySelector('canvas');
                if (imgElement || canvasElement) {
                    downloadBtn.disabled = false;
                }
            }, 150);
        }

        function downloadQR() {
            const container = document.getElementById('qrcode-container');
            const canvas = container.querySelector('canvas');
            const img = container.querySelector('img');
            let dataUrl = canvas ? canvas.toDataURL("image/png") : (img ? img.src : "");

            if (!dataUrl) {
                alert("Processing canvas structure error. Please regenerate.");
                return;
            }

            const dummyAnchor = document.createElement('a');
            dummyAnchor.href = dataUrl;
            dummyAnchor.download = 'custom-qrcode.png';
            document.body.appendChild(dummyAnchor);
            dummyAnchor.click();
            document.body.removeChild(dummyAnchor);
        }

        window.addEventListener('DOMContentLoaded', generateQRCode);
    </script>
</body>
</html>
