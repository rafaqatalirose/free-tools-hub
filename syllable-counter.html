<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syllable Counter Online</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .tool-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid #f3f4f6;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4 antialiased">

    <div class="w-full max-w-4xl tool-card p-6 md:p-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-800 mb-2">📊 Syllable Counter Online</h1>
            <p class="text-sm md:text-base text-gray-500">Analyze syllable distributions, measure word complexity frequencies, and evaluate paragraph readability indexes.</p>
        </div>

        <!-- Metric Grid Board -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
            <div class="bg-indigo-50/50 border border-indigo-100 rounded-xl p-4 text-center">
                <span class="block text-2xl md:text-3xl font-bold text-indigo-700" id="totalSyllables">0</span>
                <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Total Syllables</span>
            </div>
            <div class="bg-emerald-50/50 border border-emerald-100 rounded-xl p-4 text-center">
                <span class="block text-2xl md:text-3xl font-bold text-emerald-700" id="totalWords">0</span>
                <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Words Count</span>
            </div>
            <div class="bg-amber-50/50 border border-amber-100 rounded-xl p-4 text-center">
                <span class="block text-2xl md:text-3xl font-bold text-amber-700" id="avgSyllables">0.0</span>
                <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Avg Syllables/Word</span>
            </div>
            <div class="bg-rose-50/50 border border-rose-100 rounded-xl p-4 text-center">
                <span class="block text-xl md:text-2xl font-bold text-rose-700 pt-1" id="readabilityScore">N/A</span>
                <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Complexity Tier</span>
            </div>
        </div>

        <!-- Input Area Component -->
        <div class="flex flex-col gap-2">
            <label class="text-sm font-semibold text-gray-700">Type or Paste Your Content Copy:</label>
            <textarea id="textInput" class="w-full h-56 p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-none transition text-gray-700 text-base" placeholder="Paste your essays, poetic versus, manuscripts, or web copy here to evaluate precise linguistic syllable counts instantly..." oninput="analyzeSyllables()"></textarea>
        </div>

        <!-- Actions Interface -->
        <div class="flex justify-end gap-3 mt-4">
            <button onclick="copyContent()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl shadow-md shadow-indigo-100 transition transform active:scale-95 cursor-pointer text-sm">
                📋 Copy Text
            </button>
            <button onclick="clearContent()" class="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-600 font-medium rounded-xl transition transform active:scale-95 cursor-pointer text-sm">
                🗑️ Clear
            </button>
        </div>

        <!-- Toast Notification Alert -->
        <div id="toastAlert" class="fixed bottom-5 right-5 bg-gray-900 text-white text-sm px-4 py-2 rounded-lg opacity-0 transition-opacity duration-300 pointer-events-none shadow-lg">
            Text copied to clipboard!
        </div>
    </div>

    <!-- Logic Controller Core Engine -->
    <script>
        function cleanWord(word) {
            return word.toLowerCase().replace(/[^a-z]/g, '');
        }

        function calculateWordSyllables(word) {
            let clean = cleanWord(word);
            if (clean.length === 0) return 0;
            if (clean.length <= 3) return 1;

            // Linguistic exception exclusions (silent e at the end, ed/es line adjustments)
            clean = clean.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, '');
            clean = clean.replace(/^y/, '');

            // Match vowel cluster groupings
            const vowelMatches = clean.match(/[aeiouy]{1,2}/g);
            return vowelMatches ? vowelMatches.length : 1;
        }

        function analyzeSyllables() {
            const rawText = document.getElementById('textInput').value;
            if (!rawText.trim()) {
                resetDashboard();
                return;
            }

            // Parse words sequence arrays
            const wordsArray = rawText.trim().split(/\s+/);
            let totalWordsCount = wordsArray.length;
            let totalSyllablesCount = 0;

            wordsArray.forEach(word => {
                totalSyllablesCount += calculateWordSyllables(word);
            });

            // Calculate average metrics
            const avgVal = totalWordsCount > 0 ? (totalSyllablesCount / totalWordsCount).toFixed(1) : 0;

            // Determine Content Complexity Tier based on Avg Syllable Ratio
            let tier = "Simple";
            if (avgVal > 2.0) {
                tier = "Advanced";
            } else if (avgVal >= 1.5) {
                tier = "Moderate";
            }

            // Render calculations to Interface Display
            document.getElementById('totalSyllables').innerText = totalSyllablesCount;
            document.getElementById('totalWords').innerText = totalWordsCount;
            document.getElementById('avgSyllables').innerText = avgVal;
            document.getElementById('readabilityScore').innerText = tier;
        }

        function resetDashboard() {
            document.getElementById('totalSyllables').innerText = '0';
            document.getElementById('totalWords').innerText = '0';
            document.getElementById('avgSyllables').innerText = '0.0';
            document.getElementById('readabilityScore').innerText = 'N/A';
        }

        function clearContent() {
            document.getElementById('textInput').value = '';
            resetDashboard();
        }

        function copyContent() {
            const txt = document.getElementById('textInput').value;
            if (!txt.trim()) return;
            
            navigator.clipboard.writeText(txt).then(() => {
                const toast = document.getElementById('toastAlert');
                toast.classList.remove('opacity-0');
                setTimeout(() => {
                    toast.classList.add('opacity-0');
                }, 2000);
            });
        }
    </script>
</body>
</html>
