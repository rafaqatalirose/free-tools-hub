<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Word & Character Counter Tool</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .tool-box {
            background: #ffffff;
            max-width: 700px;
            width: 100%;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h2 {
            margin-top: 0;
            color: #333;
            font-size: 1.6rem;
            border-bottom: 2px solid #f1f1f1;
            padding-bottom: 10px;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s ease;
        }
        textarea:focus {
            border-color: #007bff;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        @media (max-width: 500px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
        .stat-card {
            background: #f1f3f5;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
        }
        .stat-card .num {
            font-size: 1.5rem;
            font-weight: bold;
            color: #007bff;
            display: block;
        }
        .stat-card .label {
            font-size: 0.85rem;
            color: #666;
            text-transform: uppercase;
            margin-top: 5px;
            display: block;
        }
        .reading-time {
            margin-top: 15px;
            font-size: 0.95rem;
            color: #495057;
            background: #e7f5ff;
            padding: 10px 15px;
            border-radius: 6px;
            border-left: 4px solid #339af0;
        }
        .btn-clear {
            margin-top: 15px;
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-clear:hover { background: #c82333; }
    </style>
</head>
<body>

<div class="tool-box">
    <h2>Smart Word Counter Tool</h2>
    <textarea id="textInput" placeholder="Apna text yahan paste ya type karein..."></textarea>
    
    <button class="btn-clear" onclick="clearText()">Clear Text</button>

    <div class="stats-grid">
        <div class="stat-card">
            <span class="num" id="wordCount">0</span>
            <span class="label">Words</span>
        </div>
        <div class="stat-card">
            <span class="num" id="charCount">0</span>
            <span class="label">Characters</span>
        </div>
        <div class="stat-card">
            <span class="num" id="spaceCount">0</span>
            <span class="label">Spaces</span>
        </div>
        <div class="stat-card">
            <span class="num" id="paraCount">0</span>
            <span class="label">Paragraphs</span>
        </div>
    </div>

    <div class="reading-time">
        ⏱️ Estimated Reading Time: <strong id="readTime">0 min</strong>
    </div>
</div>

<script>
    const textInput = document.getElementById('textInput');
    const wordCount = document.getElementById('wordCount');
    const charCount = document.getElementById('charCount');
    const spaceCount = document.getElementById('spaceCount');
    const paraCount = document.getElementById('paraCount');
    const readTime = document.getElementById('readTime');

    textInput.addEventListener('input', () => {
        const text = textInput.value;
        
        // Character Count
        charCount.innerText = text.length;
        
        // Space Count
        const spaces = text.split(" ").length - 1;
        spaceCount.innerText = spaces < 0 ? 0 : spaces;

        // Word Count
        const words = text.trim().split(/\s+/).filter(item => item);
        wordCount.innerText = words.length;

        // Paragraph Count
        const paragraphs = text.split(/\n+/).filter(item => item.trim() !== "");
        paraCount.innerText = paragraphs.length;

        // Reading Time (Average 200 words per minute)
        const time = Math.ceil(words.length / 200);
        readTime.innerText = words.length > 0 ? time + " min" : "0 min";
    });

    function clearText() {
        textInput.value = '';
        textInput.dispatchEvent(new Event('input'));
    }
</script>

</body>
</html>
