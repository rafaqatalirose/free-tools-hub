<div class="tool-card-custom">
    <!-- Header -->
    <h2 class="tool-title">• Bullet Point Maker</h2>
    
    <!-- Input Section -->
    <textarea id="textInput" class="input-textarea-custom" placeholder="Paste your items here (one per line)..."></textarea>
    
    <!-- Action Buttons -->
    <div class="button-group-custom">
        <select id="bulletStyle" class="input-select-custom">
            <option value="•">Round Bullet (•)</option>
            <option value="-">Hyphen (-)</option>
            <option value="*">Asterisk (*)</option>
            <option value=">">Arrow (>)</option>
        </select>
        <button class="btn-primary-custom" onclick="generateBullets()">Generate Bullets</button>
        <button class="btn-clear-custom" onclick="clearAll()">Clear Text</button>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid-custom">
        <div class="stat-box">
            <span class="stat-value" id="itemCount">0</span>
            <span class="stat-label">ITEMS</span>
        </div>
        <div class="stat-box">
            <span class="stat-value" id="statusBadge">READY</span>
            <span class="stat-label">STATUS</span>
        </div>
    </div>

    <!-- Output -->
    <textarea id="textOutput" class="output-textarea-custom" readonly style="display:none;"></textarea>
</div>

<style>
    .tool-card-custom { background: #fff; border-radius: 12px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 600px; margin: 20px auto; border: 1px solid #f0f0f0; }
    .tool-title { font-size: 22px; color: #333; margin-bottom: 20px; }
    .input-textarea-custom { width: 100%; height: 150px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; }
    .button-group-custom { display: flex; gap: 10px; margin-bottom: 20px; }
    .btn-primary-custom { background: #28a745; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
    .btn-clear-custom { background: #dc3545; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
    .input-select-custom { padding: 5px; border-radius: 6px; border: 1px solid #ddd; }
    .stats-grid-custom { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
    .stat-box { background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; border: 1px dashed #ccc; }
    .stat-value { display: block; font-size: 20px; font-weight: bold; color: #007bff; }
    .stat-label { font-size: 10px; color: #666; letter-spacing: 1px; }
    .output-textarea-custom { width: 100%; height: 150px; padding: 12px; border: 1px solid #007bff; border-radius: 8px; margin-top: 20px; background: #eef6ff; }
</style>

<script>
    function generateBullets() {
        const text = document.getElementById('textInput').value;
        const style = document.getElementById('bulletStyle').value;
        let lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
        
        let outputLines = lines.map(line => style + " " + line);
        
        document.getElementById('textOutput').value = outputLines.join('\n');
        document.getElementById('textOutput').style.display = 'block';
        document.getElementById('itemCount').innerText = lines.length;
        document.getElementById('statusBadge').innerText = "DONE";
    }

    function clearAll() {
        document.getElementById('textInput').value = '';
        document.getElementById('textOutput').style.display = 'none';
        document.getElementById('itemCount').innerText = '0';
        document.getElementById('statusBadge').innerText = 'READY';
    }
</script>
