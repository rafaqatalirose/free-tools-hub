<div class="tool-card-custom">
    <div class="tool-header">
        <h2>✨ Add Line Prefixes</h2>
        <p>Add custom text, symbols, or prefixes to the beginning of every line instantly.</p>
    </div>
    
    <textarea id="textInput" class="input-textarea-custom" placeholder="Paste your text here...&#10;Line 1&#10;Line 2&#10;Line 3" oninput="updateInputStats()"></textarea>
    
    <div class="controls-grid">
        <div class="input-group">
            <label>Prefix Text</label>
            <input type="text" id="prefixText" class="input-field" placeholder="e.g., ID-, http://, >>">
        </div>
        <div class="input-group" style="display: flex; align-items: flex-end;">
            <label class="checkbox-container">
                <input type="checkbox" id="skipEmpty" checked>
                <span class="checkmark"></span>
                Skip Empty Lines
            </label>
        </div>
    </div>

    <div class="action-row-custom">
        <button class="btn-custom btn-primary-custom" onclick="addLinePrefixes()">
            ⚡ Add Prefix
        </button>
        <button class="btn-custom btn-reset-custom" onclick="clearAllPrefixTool()">Reset</button>
    </div>

    <div class="stats-grid-custom">
        <div class="stat-box">
            <span class="stat-value" id="lineCount">0</span>
            <span class="stat-label">TOTAL LINES</span>
        </div>
        <div class="stat-box">
            <span class="stat-value" id="statusBadgePrefix">READY</span>
            <span class="stat-label">STATUS</span>
        </div>
    </div>

    <div id="outputContainerPrefix" style="display:none; margin-top: 20px;">
        <label style="font-size: 0.8rem; font-weight: 600; color: #b2bec3; display: block; margin-bottom: 5px;">Output Result:</label>
        <textarea id="textOutput" class="output-textarea-custom" readonly></textarea>
        <button class="btn-custom btn-copy" onclick="copyPrefixResult()" style="margin-top:10px; width: 100%; background: #2ecc71; color: white;">
            📋 Copy Result
        </button>
    </div>
</div>

<style>
    /* Premium UI Styling */
    .tool-card-custom { background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border: 1px solid #f0f0f0; max-width: 800px; margin: auto; font-family: 'Inter', sans-serif; }
    .tool-header h2 { color: #2d3436; margin-bottom: 5px; font-size: 24px; }
    .tool-header p { color: #636e72; font-size: 0.9rem; margin-bottom: 20px; }
    .input-textarea-custom, .output-textarea-custom { width: 100%; height: 160px; padding: 15px; border: 2px solid #eef2f3; border-radius: 12px; margin-bottom: 15px; font-size: 14px; transition: border 0.3s; font-family: monospace; }
    .input-textarea-custom:focus { border-color: #6c5ce7; outline: none; }
    .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .input-group label { font-size: 0.8rem; font-weight: 600; color: #b2bec3; display: block; margin-bottom: 5px; }
    .input-field { width: 100%; padding: 12px; border: 2px solid #eef2f3; border-radius: 8px; font-size: 14px; transition: border 0.3s; }
    .input-field:focus { border-color: #6c5ce7; outline: none; }
    
    /* Custom Checkbox Styling */
    .checkbox-container { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: #636e72; font-weight: 500; height: 45px; }
    
    .action-row-custom { display: flex; gap: 10px; margin-bottom: 20px; }
    .btn-custom { padding: 12px 25px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; transition: transform 0.2s, background 0.3s; font-size: 15px; }
    .btn-primary-custom { background: #6c5ce7; color: white; flex: 2; }
    .btn-primary-custom:hover { background: #5b4bd6; transform: translateY(-1px); }
    .btn-reset-custom { background: #dfe6e9; color: #636e72; flex: 1; }
    .btn-reset-custom:hover { background: #b2bec3; }
    
    .stats-grid-custom { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: center; }
    .stat-box { background: #f8f9fa; padding: 15px; border-radius: 12px; border: 1px solid #edf2f7; }
    .stat-value { display: block; font-size: 1.6rem; font-weight: 700; color: #6c5ce7; }
    .stat-label { font-size: 0.7rem; color: #b2bec3; letter-spacing: 1px; font-weight: 600; }
</style>

<script>
    function updateInputStats() {
        const text = document.getElementById('textInput').value;
        const lines = text ? text.split('\n').length : 0;
        document.getElementById('lineCount').innerText = lines;
    }

    function addLinePrefixes() {
        const text = document.getElementById('textInput').value;
        const prefix = document.getElementById('prefixText').value;
        const skipEmpty = document.getElementById('skipEmpty').checked;
        
        if (!text) return alert("Please enter some text first.");
        
        const lines = text.split('\n');
        const modifiedLines = lines.map(line => {
            // If skip empty is true and line is blank, don't append prefix
            if (skipEmpty && line.trim() === "") {
                return line;
            }
            return prefix + line;
        });
        
        document.getElementById('textOutput').value = modifiedLines.join('\n');
        document.getElementById('outputContainerPrefix').style.display = 'block';
        document.getElementById('statusBadgePrefix').innerText = "DONE";
        document.getElementById('statusBadgePrefix').style.color = "#2ecc71";
    }

    function clearAllPrefixTool() {
        document.getElementById('textInput').value = '';
        document.getElementById('prefixText').value = '';
        document.getElementById('outputContainerPrefix').style.display = 'none';
        document.getElementById('lineCount').innerText = '0';
        document.getElementById('statusBadgePrefix').innerText = 'READY';
        document.getElementById('statusBadgePrefix').style.color = '#6c5ce7';
    }

    function copyPrefixResult() {
        const output = document.getElementById('textOutput');
        output.select();
        document.execCommand('copy');
        
        // Simple UI feedback
        const copyBtn = document.querySelector('.btn-copy');
        const originalText = copyBtn.innerHTML;
        copyBtn.innerHTML = "✅ Copied!";
        setTimeout(() => {
            copyBtn.innerHTML = originalText;
        }, 2000);
    }
</script>
