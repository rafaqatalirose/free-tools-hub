<div class="tool-container" style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 900px; margin: 0 auto; padding: 25px; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);">
    
    <div class="metrics-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px;">
        <div class="metric-card" style="background: #f8f9fa; border-left: 4px solid #4f46e5; padding: 15px; border-radius: 6px;">
            <span style="display: block; font-size: 13px; color: #6c757d; font-weight: 600; text-transform: uppercase;">Total Tags Found</span>
            <span id="tagCount" style="font-size: 24px; font-weight: 700; color: #212529;">0</span>
        </div>
        <div class="metric-card" style="background: #f8f9fa; border-left: 4px solid #d946ef; padding: 15px; border-radius: 6px;">
            <span style="display: block; font-size: 13px; color: #6c757d; font-weight: 600; text-transform: uppercase;">Unique Hashtags</span>
            <span id="uniqueCount" style="font-size: 24px; font-weight: 700; color: #212529;">0</span>
        </div>
    </div>

    <div class="config-bar" style="background: #f1f5f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 20px; flex-wrap: wrap;">
        <label style="font-weight: 600; font-size: 14px; color: #334155; display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="checkbox" id="lowercaseTags" checked style="accent-color: #4f46e5; width: 16px; height: 16px;"> Force Lowercase Outputs
        </label>
        <label style="font-weight: 600; font-size: 14px; color: #334155; display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="checkbox" id="stripHashSymbol" style="accent-color: #4f46e5; width: 16px; height: 16px;"> Strip '#' Symbol From Results
        </label>
    </div>

    <div class="input-group" style="margin-bottom: 20px;">
        <label for="rawInput" style="display: block; font-weight: 600; margin-bottom: 8px; color: #333;">Paste Social Media Content, Marketing Transcripts, or Raw Captions Content:</label>
        <textarea id="rawInput" placeholder="Paste your unformatted post captions, multi-platform ad scripts, metadata sheets, or raw texts here..." style="width: 100%; height: 220px; padding: 12px; border: 1px solid #ced4da; border-radius: 6px; font-family: monospace; font-size: 14px; resize: vertical; box-sizing: border-box; transition: border-color 0.2s;" oninput="this.style.borderColor='#4f46e5'"></textarea>
    </div>

    <div class="control-actions" style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 25px;">
        <button onclick="executeHashtagExtraction()" style="flex: 1; min-width: 160px; background: #4f46e5; color: white; border: none; padding: 12px 20px; font-weight: 600; border-radius: 6px; cursor: pointer; transition: background 0.2s;" onmouseover="this.style.background='#3730a3'" onmouseout="this.style.background='#4f46e5'">Extract Hashtags</button>
        <button onclick="copyExtractedData()" style="background: #d946ef; color: white; border: none; padding: 12px 20px; font-weight: 600; border-radius: 6px; cursor: pointer; transition: background 0.2s;" onmouseover="this.style.background='#c026d3'" onmouseout="this.style.background='#d946ef'">Copy Tags List</button>
        <button onclick="resetParserWorkspace()" style="background: #ef4444; color: white; border: none; padding: 12px 20px; font-weight: 600; border-radius: 6px; cursor: pointer; transition: background 0.2s;" onmouseover="this.style.background='#dc2626'" onmouseout="this.style.background='#ef4444'">Clear Workspace</button>
    </div>

    <div class="output-group">
        <label for="cleanOutput" style="display: block; font-weight: 600; margin-bottom: 8px; color: #333;">Extracted Social Metadata (Sanitized Output Array):</label>
        <textarea id="cleanOutput" readonly placeholder="Your clean extracted hashtags will populate line-by-line here instantly..." style="width: 100%; height: 200px; padding: 12px; border: 1px solid #ced4da; border-radius: 6px; font-family: monospace; font-size: 14px; background-color: #f8f9fa; resize: vertical; box-sizing: border-box;"></textarea>
    </div>
</div>

<script>
function executeHashtagExtraction() {
    const rawData = document.getElementById('rawInput').value;
    const outputField = document.getElementById('cleanOutput');
    const forceLowercase = document.getElementById('lowercaseTags').checked;
    const stripHash = document.getElementById('stripHashSymbol').checked;
    
    // High-Precision Social Graph Regex to Isolate Valid Hashtags
    const hashtagRegex = /#[\w_]+/g;
    
    const matches = rawData.match(hashtagRegex);
    
    if (!matches) {
        outputField.value = "No valid social identifiers or hashtag configurations matched within the text block.";
        document.getElementById('tagCount').innerText = "0";
        document.getElementById('uniqueCount').innerText = "0";
        return;
    }
    
    // Normalization processing pipeline
    let processedTags = matches.map(tag => {
        let cleaned = tag;
        if (forceLowercase) {
            cleaned = cleaned.toLowerCase();
        }
        if (stripHash) {
            cleaned = cleaned.replace('#', '');
        }
        return cleaned.trim();
    });
    
    const uniqueTags = [...new Set(processedTags)];
    
    outputField.value = uniqueTags.join('\n');
    document.getElementById('tagCount').innerText = matches.length;
    document.getElementById('uniqueCount').innerText = uniqueTags.length;
}

function copyExtractedData() {
    const outputField = document.getElementById('cleanOutput');
    if (outputField.value && !outputField.value.startsWith("No valid") && !outputField.value.startsWith("Your clean")) {
        outputField.select();
        document.execCommand('copy');
    }
}

function resetParserWorkspace() {
    document.getElementById('rawInput').value = '';
    document.getElementById('cleanOutput').value = '';
    document.getElementById('tagCount').innerText = '0';
    document.getElementById('uniqueCount').innerText = '0';
}
</script>
