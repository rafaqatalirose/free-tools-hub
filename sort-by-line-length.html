<div class="tool-card-custom">
    <!-- Header -->
    <h2 class="tool-title">📏 Sort by Line Length</h2>
    
    <!-- Input Section -->
    <textarea id="textInput" class="input-textarea-custom" placeholder="Paste your text here..."></textarea>
    
    <!-- Action Buttons -->
    <div class="button-group-custom">
        <select id="sortOrder" class="input-select-custom">
            <option value="asc">Shortest to Longest</option>
            <option value="desc">Longest to Shortest</option>
        </select>
        <button class="btn-primary-custom" onclick="sortByLength()">Sort Lines</button>
        <button class="btn-clear-custom" onclick="clearAll()">Clear Text</button>
    </div>

    <!-- Stats Grid (Inspired by your image) -->
    <div class="stats-grid-custom">
        <div class="stat-box">
            <span class="stat-value" id="lineCount">0</span>
            <span class="stat-label">LINES</span>
        </div>
        <div class="stat-box">
            <span class="stat-value" id="charCount">0</span>
            <span class="stat-label">CHARS</span>
        </div>
    </div>

    <!-- Output -->
    <textarea id="textOutput" class="output-textarea-custom" readonly style="display:none;"></textarea>
</div>

<style>
    .tool-card-custom {
        background: #fff;
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        max-width: 600px;
        margin: 20px auto;
        border: 1px solid #f0f0f0;
    }
    .tool-title { font-size: 22px; color: #333; margin-bottom: 20px; }
    .input-textarea-custom { width: 100%; height: 150px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; resize: vertical; }
    
    .button-group-custom { display: flex; gap: 10px; margin-bottom: 20px; }
    .btn-primary-custom { background: #28a745; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
    .btn-clear-custom { background: #dc3545; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
    
    .stats-grid-custom { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
    .stat-box { background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; border: 1px dashed #ccc; }
    .stat-value { display: block; font-size: 20px; font-weight: bold; color: #007bff; }
    .stat-label { font-size: 10px; color: #666; letter-spacing: 1px; }
    
    .output-textarea-custom { width: 100%; height: 150px; padding: 12px; border: 1px solid #007bff; border-radius: 8px; margin-top: 20px; background: #eef6ff; }
</style>

<script>
    function sortByLength() {
        const text = document.getElementById('textInput').value;
        const order = document.getElementById('sortOrder').value;
        let lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
        
        lines.sort((a, b) => order === 'asc' ? a.length - b.length : b.length - a.length);
        
        const output = document.getElementById('textOutput');
        output.value = lines.join('\n');
        output.style.display = 'block';
        
        // Update stats
        document.getElementById('lineCount').innerText = lines.length;
        document.getElementById('charCount').innerText = text.replace(/\s/g, '').length;
    }
    function clearAll() {
        document.getElementById('textInput').value = '';
        document.getElementById('textOutput').style.display = 'none';
        document.getElementById('lineCount').innerText = '0';
        document.getElementById('charCount').innerText = '0';
    }
</script>
